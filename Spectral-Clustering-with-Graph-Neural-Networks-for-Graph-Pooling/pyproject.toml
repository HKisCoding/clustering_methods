[project]
name = "spectral-clustering-with-graph-neural-networks-for-graph-pooling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "numpy==1.24.1",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchvision==0.22.0",
    "tqdm==4.65.0",
    "munkres==1.1.4",
    "pandas",
    "torch-geometric",
]

[tool.uv.sources]
torch = { index = "torch-gpu" }
torchaudio = { index = "torch-gpu" }
torchvision = { index = "torch-gpu" }

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pyright]
pythonVersion = "3.11"
venvPath = "../"
venv = ".venv"
